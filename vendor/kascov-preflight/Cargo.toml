[workspace]
resolver = "2"
members = [
  "crates/kascov-decode",
  "crates/kascov-sim",
  "crates/studio-kascov-preflight",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Knitser/kascov"

[workspace.dependencies]
kascov-decode = { path = "crates/kascov-decode" }
kascov-sim = { path = "crates/kascov-sim" }

# Pin the published post-Toccata engine; Cargo.lock records registry checksums.
# This local adapter is not an unchanged upstream Kascov build.
kaspa-consensus-core = { version = "=2.1.0" }
kaspa-addresses = { version = "=2.1.0" }
kaspa-txscript = { version = "=2.1.0" }
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
blake2b_simd = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
